name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the packages but publish nothing'
        type: boolean
        default: true

permissions:
  contents: write   # needed to create the release and upload to it

jobs:
  # A release with no licence file leaves whoever receives it unable to
  # redistribute it.  Checked before anything is built, so the failure is
  # immediate rather than after twenty minutes of packaging.
  licence-check:
    name: Licence present
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require a LICENSE file
        run: |
          if [ ! -f LICENSE ]; then
            echo "No LICENSE file: a published package would carry no terms."
            exit 1
          fi

  deb:
    name: .deb (${{ matrix.runner }})
    needs: licence-check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Two builds because a .deb built against a newer glibc will not install
        # on an older release; the 22.04 package covers the older systems.
        runner: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libssl-dev zlib1g-dev libicu-dev
      - name: Build packages
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DIMAP2PST_BUILD_TESTS=OFF
          cmake --build build --parallel
          cd build && cpack -G "DEB;TGZ"
      - name: Name the artefacts after the distribution they were built on
        run: |
          source /etc/os-release
          mkdir -p out
          for f in build/*.deb; do
            mv "$f" "out/$(basename "${f%.deb}")~${ID}${VERSION_ID}.deb"
          done
          for f in build/*.tar.gz; do
            mv "$f" "out/$(basename "${f%.tar.gz}")~${ID}${VERSION_ID}.tar.gz"
          done
          ls -la out
      - name: Verify the package installs and runs
        run: |
          sudo apt-get install -y ./out/*.deb
          imap2pst --help
          man -w imap2pst
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.runner }}
          path: out/*

  rpm:
    name: .rpm (Fedora)
    needs: licence-check
    runs-on: ubuntu-24.04
    container: fedora:40
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install gcc-c++ cmake ninja-build git rpm-build \
            openssl-devel zlib-devel libicu-devel
      - uses: actions/checkout@v4
      - name: Build packages
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DIMAP2PST_BUILD_TESTS=OFF
          cmake --build build --parallel
          cd build && cpack -G RPM
      - name: Verify the package installs and runs
        run: |
          dnf -y install ./build/*.rpm
          imap2pst --help
      - uses: actions/upload-artifact@v4
        with:
          name: packages-fedora
          path: build/*.rpm

  source-tarball:
    name: Source tarball
    needs: licence-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev \
            zlib1g-dev libicu-dev
      # Not an obligation under MIT, but a release that carries the exact
      # source its binaries were built from is worth more than one that does
      # not, particularly for a tool people run against their own mail.
      - name: Build the source package
        run: |
          cmake -S . -B build -G Ninja -DIMAP2PST_BUILD_TESTS=OFF
          cd build && cpack --config CPackSourceConfig.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: packages-source
          path: build/*-Source.tar.gz

  publish:
    name: Publish release
    needs: [deb, rpm, source-tarball]
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List what is about to be published
        run: ls -la artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "imap2pst ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
